# Build the flashable Raspberry Pi SD card image and attach it to a GitHub
# Release. Manual only (Actions -> "Build SD card image" -> Run workflow, give
# a tag): a build takes about an hour of Actions time, and players update in
# place (Settings -> Updates), so releases never build one on their own.
name: Build SD card image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.6.3)"
        required: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Work out the tag
        run: echo "TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Free disk space (pi-gen needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build image
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q binfmt-support qemu-user-static
          sudo install -d -o "$USER" /mnt/spp-pigen
          WORK=/mnt/spp-pigen bash image/build.sh "${TAG#v}"
          ls -lh image/out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" image/out/*.img.xz image/out/*.sha256 --clobber
