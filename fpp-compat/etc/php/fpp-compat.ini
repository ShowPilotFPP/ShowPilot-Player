; PHP settings FPP's own php.ini sets and plugins depend on. Loaded for
; plugin pages (php-cgi) and plugin scripts (php CLI) through
; PHP_INI_SCAN_DIR, set by ShowPilot Player at startup.
;
; Many FPP plugins write "<?" instead of "<?php". Without short_open_tag the
; code is sent to the browser as text the browser hides, so settings fields,
; dropdowns and if-blocks silently disappear.
short_open_tag = On
display_errors = Off
log_errors = On
max_execution_time = 300
upload_max_filesize = 4G
post_max_size = 4G
